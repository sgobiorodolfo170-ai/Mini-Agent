name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # 应用是 Windows 专属（划词/PowerShell 工具/托盘/NSIS），测试也含 Windows 真实路径
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run test:e2e:mock
